name: Playwright Tests

# Note: NSU RDS (http://10.102.11.254/rds/) is hosted on the local NSU intranet.
# GitHub-hosted cloud runners cannot access private 10.x.x.x IPs directly without a VPN or Self-Hosted Runner.
# workflow_dispatch allows manual execution when running on a connected self-hosted runner.

# Triggers disabled for automatic push/pull_request to prevent running on local intranet IP (10.102.11.254).
# Only runs when manually triggered via GitHub Actions UI (workflow_dispatch).
on:
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
      continue-on-error: true
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 14
